.text-orange-400{
  --tw-text-opacity: 1;
  color: rgb(251 146 60 / var(--tw-text-opacity, 1));
}
.accent-\[\#ffd700\]{
  accent-color: #ffd700;
}
.outline-none{
  outline: 2px solid transparent;
  outline-offset: 2px;
}
.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}
.transition-colors{
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}
:root {
  --bg: #000000;
  --surface: #0a0a05;
  --surface-2: #111108;
  --gold: #ffd700;
  --gold-dim: #8a7400;
  --green: #39ff88;
  --ink: #e8e3c8;
  --ink-dim: #9a9478;
  --line: #3a3405;
  --danger: #ff5555;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --surface: #0a0a05;
    --surface-2: #111108;
    --gold: #ffd700;
    --gold-dim: #8a7400;
    --green: #39ff88;
    --ink: #e8e3c8;
    --ink-dim: #9a9478;
    --line: #3a3405;
    --danger: #ff5555;
  }
}
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* {
  box-sizing: border-box;
}
::-moz-selection {
  background: var(--gold);
  color: #000;
}
::selection {
  background: var(--gold);
  color: #000;
}
textarea, input {
  font-family: inherit;
}
.scroll-thin::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
.scroll-thin::-webkit-scrollbar-thumb {
  background: var(--gold-dim);
}
.scroll-thin::-webkit-scrollbar-track {
  background: var(--surface-2);
}
@keyframes blink {
  0%, 60% {
    opacity: 1;
  }
  61%, 100% {
    opacity: 0.15;
  }
}
.led-blink {
  animation: blink 1.1s steps(1) infinite;
}
@keyframes scanmove {
  from {
    background-position: 0 0;
  }
  to {
    background-position: 0 8px;
  }
}
.scanlines {
  background-image: repeating-linear-gradient(0deg, rgba(255,215,0,0.035) 0 1px, transparent 1px 4px);
  animation: scanmove 0.6s linear infinite;
}
mark.clou {
  background: var(--gold);
  color: #000;
  padding: 0 2px;
  font-weight: 800;
}
mark.clou-green {
  background: var(--green);
  color: #000;
  padding: 0 2px;
  font-weight: 800;
}
.placeholder\:text-\[var\(--ink-dim\)\]::-moz-placeholder{
  color: var(--ink-dim);
}
.placeholder\:text-\[var\(--ink-dim\)\]::placeholder{
  color: var(--ink-dim);
}
.hover\:bg-\[var\(--gold\)\]:hover{
  background-color: var(--gold);
}
.hover\:text-\[var\(--gold\)\]:hover{
  color: var(--gold);
}
.hover\:text-black:hover{
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}
.focus\:border-\[var\(--green\)\]:focus{
  border-color: var(--green);
}
.active\:bg-\[var\(--gold\)\]:active{
  background-color: var(--gold);
}
.active\:text-black:active{
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}
.disabled\:pointer-events-none:disabled{
  pointer-events: none;
}
.disabled\:opacity-40:disabled{
  opacity: 0.4;
}
@media (min-width: 640px){
  .sm\:w-auto{
    width: auto;
  }
  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .sm\:grid-cols-5{
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
  .sm\:text-lg{
    font-size: 1.125rem;
    line-height: 1.75rem;
  }
  .sm\:text-sm{
    font-size: 0.875rem;
    line-height: 1.25rem;
  }
  .sm\:text-xs{
    font-size: 0.75rem;
    line-height: 1rem;
  }
}
@media (min-width: 768px){
  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
